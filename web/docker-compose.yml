services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onlypans
      POSTGRES_PASSWORD: onlypans
      POSTGRES_DB: onlypans
    ports:
      - "5433:5432"
    volumes:
      - onlypans_pg_data:/var/lib/postgresql/data

volumes:
  onlypans_pg_data:
